name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无构建 = 文件拷贝：游戏发的是原生 ES module，站点内容 = 页面自己够得到的每一件事。
      # 实测清单：index.html + manifest.webmanifest + sw.js + css/ + js/ + icons/ + assets/
      # （与 tools/wiring-check.sh 第 4 段拼的那份同源 —— 两边不一致就是线上 404 而 CI 全绿）。
      # server.cjs、tools/（七道闸与 bench）、docs/、package.json 留在工件之外，
      # 也顺手把 node_modules 留在外面 —— `path: .` 会连它一起上传。
      #
      # 拷哪些不写在这里——写在 tools/assemble-site.sh，本地闸与 CI 调同一支脚本。
      # 以前这里是手抄的三行 cp（index.html/css/js），于是页面后来引用的
      # manifest.webmanifest、sw.js、icons/* 全都上不了线：线上 404，而 CI 一路绿，
      # 因为没有任何一步加载过那份产物。服务器、台架、文档、node_modules 仍在 artifact 外面。
      #
      # 版本三元组是真实存在的那一组：configure-pages@v5 / upload-pages-artifact@v3 / deploy-pages@v4。
      # 老的 (v3/v1/v2) 在 marketplace 上 404 而 run 仍然报绿 —— 那就是"部署悄悄停止部署"的形状。
      # Pages 必须先开成 workflow 构建（本仓在推送这份工作流之前已经 POST /pages 建好），
      # 否则 configure-pages@v5 直接红。
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      # 对**即将上传的那一份**提要求：查一份自己重新拷的副本等于没查上线那份。
      # 清单落后于页面时，线上就是 404 自己的 manifest/sw.js/图标，
      # 而仓里的引擎测试与浏览器闸全绿 —— 它们跑的都是仓库根。
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      # 工件边界：门禁代码一旦进了线上那份，"线上跑的正是这个仓"这句话就开始包含 tools/，
      # 而浏览器闸对部署形态只看得到页面 —— 泄漏不会被任何一条腿发现。
      - name: Artifact boundary
        run: |
          test ! -e _site/tools
          test ! -e _site/server.cjs
          test ! -e _site/package.json
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/js/ui/app.js
          test -f _site/js/engine/generate.js
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png
          test -f _site/icons/apple-touch-icon.png
          test -f _site/assets/textures/paper-grain.png
          test -f _site/assets/sprites/spark.png
      # 这两步必须真的存在，不是注释里的名字。少了 upload-pages-artifact，deploy job 会拿着一个
      # 不存在的工件继续跑；少了 configure-pages，pages 的 environment 就没被绑定。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
